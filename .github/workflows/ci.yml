name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Build only: no signing identity, no notarization, no secrets. The bundle is
# signed ad hoc exactly as a local `./build.sh --dev` would sign it.
jobs:
  build:
    name: Build, selftest, sealed guard, tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Sealed-fork guard
        run: ./Tools/check-sealed.sh

      - name: Build (Developer variant, ad hoc)
        run: ./build.sh --dev

      - name: Selftest
        run: ./build/YayasSpaceDeveloper --selftest

      - name: Unit tests
        run: ./build.sh --test
